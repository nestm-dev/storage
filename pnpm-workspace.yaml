packages:
  - '.'

# @nestjs/core's postinstall is only a donation banner; never run it.
allowBuilds:
  '@nestjs/core': false

# `changeset publish` shells out to `pnpm publish`, and pnpm ignores
# package.json's publishConfig.provenance.
provenance: true

minimumReleaseAgeExclude:
  - files-sdk@2.4.1
  - '@nestjs/common@12.0.1'
  - '@nestjs/core@12.0.1'
  - '@nestjs/platform-express@12.0.1'
  - '@nestjs/platform-fastify@12.0.1'
  - '@nestjs/testing@12.0.1'
  - '@aws-sdk/client-s3@3.1120.0'
  - '@aws-sdk/lib-storage@3.1120.0'
  - '@aws-sdk/s3-presigned-post@3.1120.0'
  - '@aws-sdk/s3-request-presigner@3.1120.0'
  - '@types/node@26.4.0'
  - ai@7.0.83
  - '@nestm/crypto@0.1.0-alpha.9'
